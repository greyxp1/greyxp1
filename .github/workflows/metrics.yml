name: Metrics
on:
  schedule: [{ cron: "0 * * * *" }]
  workflow_dispatch:
  push: { branches: ["master", "main"] }
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v5
        with:
          path: .cache/metrics
          key: metrics-commits-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: metrics-commits-
      - name: Generate SVG stats
        run: python3 -u src/gen_svg.py
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
      - uses: actions/cache/save@v5
        if: ${{ !cancelled() }}
        with:
          path: .cache/metrics
          key: metrics-commits-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated.overview.svg generated.languages.svg
          git diff --cached --quiet || git commit -m "ci: update stats SVGs"
          git push
